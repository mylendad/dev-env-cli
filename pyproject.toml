[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-env"
version = "0.2.0"
description = "Install and maintain a personal development environment in Git projects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Personal Dev Environment" }]
dependencies = []

[project.scripts]
dev-env = "dev_env.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
